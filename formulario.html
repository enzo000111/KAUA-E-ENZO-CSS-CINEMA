<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Formulário de Filmes</title>
  <link rel="icon" href="index.html" type="image/x-icon">

<!--CSS-->
   <style>
body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #1a1a1a;
    color: #ffffff;
    max-width: 1200px;
    margin: 0px auto;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.6;
}

.pipoquinha {
    cursor: pointer;
    animation: piscar 0.7s step-end infinite;
}

@keyframes piscar {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0;
    }
   
} .indicacaoformulario {
max-width: 300px;
margin: 20px;
font-family: sans-serif;
}

.indicacaoformulario label {
  margin: 10px;
  font: bold;
}
.indicacaoformulario input {

  width: 100%;
  padding: 8px;
  border: 1px solid #ff0000;
  border-radius: 4px;
  box-sizing: border-box;
}
.indicacaoformulario input:focus {
  border-color: #ff0000;
  background-color:#ff0000 ;
}
.indicacaoformulario input {
border-style: solid;
}
  .indicacaoformulario button {
    background-color: #ff0000; 
    color: #ffffff;           
    border: none;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s; 
  }

 
  .indicacaoformulario button:hover {
    background-color: #ff0000; 

  .indicacaoformulario button:active {
    transform: scale(0.95);
  }
</style>

</head>









<body>
<div align="center">
<nav>
  <a href="index.html"><h3>⬅️Voltar</h3></a>
</nav>

<hr>

<h1>|Indicação de Filmes|</h1>
<img class="pipoquinha" src="pipoca.avif">
<h2>||deixe sua indicação aqui||</h2>
<form class="indicacaoformulario">
  <fieldset>


    <p><div class="campo">
      <label>Nome:</label><br>
      <input type="text" name="nome" placeholder="digite o seu nome aqui" required>
    </p></div>

    <p><div class="campo">
      <label>E-mail:</label><br>
      <input type="email" name="email" placeholder="digite seu email aqui" required>
    </p></div>

    <p><div class="campo">
      <label>data da indicação📅:</label><br>
      <input type="date" name="data" required>
    </p></div>

  <br>

  
    

    <p><div class="campo">
      <label>Nome do filme:</label><br>
      <input type="text" name="filme" placeholder="digite o nome do filme aqui" required>
    </p></div>

    <p><div class="campo">
      <label>Gênero:</label><br>
      <select name="genero" required>
        <option>Ação</option>
        <option>Comédia</option>
        <option>Terror</option>
        <option>Drama</option>
        <option>Ficção</option>
      </select>
    </p></div>

    <p>
      <label>Nota⭐:</label><br><div class="campo">
      <input type="radio" name="nota" value="1"> 1
      <input type="radio" name="nota" value="2"> 2
      <input type="radio" name="nota" value="3"> 3
      <input type="radio" name="nota" value="4"> 4
      <input type="radio" name="nota" value="5"> 5
    </p></div>

    <p><div class="campo">
      <label>Comentário🗣️:</label><br>
      <textarea name="comentario" placeholder="digite um comentario sobre o filme aqui" rows="5" cols="40"></textarea>
    </p></div>



  <br>

  
   
<h3>Já assistiu?</h3><div class="campo">
    <input type="radio" name="assistiu" value="sim"> Sim
    <input type="radio" name="assistiu" value="nao"> Não
    <input type="radio" name="assistiu" value="talvez"> Pretendo assistir
  </fieldset></div>

  <br>

  <input type="submit" value="Enviar">
  <input type="reset" value="Limpar">

</form>
</div>
</body>
</html>
